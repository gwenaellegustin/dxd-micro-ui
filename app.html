<!doctype html>
<html lang="en">
  <head>
    <title>Pain(t)</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link type="text/css" rel="stylesheet" href="src/main.css" />
    <link type="text/css" rel="stylesheet" href="src/app.css" />
  </head>
  <body>
    <div class="container-info">
      <div class="line">
        <button id="close-btn" onclick="location.href = 'index.html'">
          <img src="/close.svg" alt="Cancel" />
        </button>
        <h1 id="title">Pain(t)</h1>
        <button id="validate-btn"><img src="/next.svg" alt="Next" /></button>
      </div>
      <div class="line">
        <div>
          <button id="cancel-all-btn">
            <img src="/cancel_all.png" alt="Cancel all" />
          </button>
          <button id="cancel-btn">
            <img src="/cancel.png" alt="Cancel" />
          </button>
        </div>
        <div>
          <fieldset class="radio-button-picker">
            <label class="radio-button">
              <input
                type="radio"
                id="point"
                name="tool"
                value="point"
                checked
              />
              <img src="/radiant.png" alt="Point" />
            </label>
            <label class="radio-button">
              <input type="radio" id="pulse" name="tool" value="pulse" />
              <img src="/pulse.svg" alt="Pulse" />
            </label>
            <label class="radio-button">
              <input type="radio" id="acute" name="tool" value="acute" />
              <img src="/acute.svg" alt="Acute" />
            </label>
          </fieldset>
        </div>
        <div>
          <button id="info">
            <img src="/question_mark.png" alt="Cancel all" />
          </button>
        </div>
      </div>
      <div class="pain-row">
        <p id="pain-reference">Reference / impact:</p>
        <p id="pain-label"></p>
      </div>
      <input
        class="line"
        type="range"
        id="color-bar"
        name="color"
        min="0"
        max="1000"
      />
    </div>

    <div id="container"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
