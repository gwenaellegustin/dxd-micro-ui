<!doctype html>
<html lang="en">
  <head>
    <title>Pain(t)</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link type="text/css" rel="stylesheet" href="src/main.css" />
    <link type="text/css" rel="stylesheet" href="src/app.css" />
  </head>
  <body>
    <div class="container-info">
      <div class="line">
        <button id="close-btn">
          <img src="/icons/close.svg" alt="Cancel" />
        </button>
        <h1 id="title">Pain(t)</h1>
        <button id="validate-btn">
          <img src="/icons/next.svg" alt="Next" />
        </button>
      </div>
      <div class="line">
        <div class="grouped">
          <button id="cancel-all-btn">
            <img src="/icons/cancel_all.svg" alt="Cancel all" />
          </button>
          <button id="cancel-btn">
            <img src="/icons/cancel.svg" alt="Cancel" />
          </button>
        </div>

        <div class="grouped">
          <fieldset class="radio-button-picker">
            <label class="radio-button">
              <input
                type="radio"
                id="point"
                name="tool"
                value="point"
                checked
              />
              <img src="/icons/radiant.svg" alt="Point" />
            </label>
            <label class="radio-button">
              <input type="radio" id="pulse" name="tool" value="pulse" />
              <img src="/icons/pulse.svg" alt="Pulse" />
            </label>
            <label class="radio-button">
              <input type="radio" id="acute" name="tool" value="acute" />
              <img src="/icons/acute.svg" alt="Acute" />
            </label>
          </fieldset>
          <button id="info">
            <img src="/icons/question_mark.svg" alt="Cancel all" />
          </button>
        </div>
      </div>
      <input
        class="line"
        type="range"
        id="color-bar"
        name="color"
        min="0"
        max="1000"
      />
      <p id="hint" class="hint hidden"></p>
    </div>

    <div id="info-popup-backdrop" class="info-popup-backdrop hidden"></div>
    <div id="info-popup" class="info-popup hidden">
      <div class="info-popup-item" data-tool="point">
        <div class="info-popup-icon">
          <img src="/icons/radiant.svg" alt="Radiating" />
        </div>
        <h2>Radiating</h2>
      </div>
      <div class="info-popup-item" data-tool="pulse">
        <div class="info-popup-icon">
          <img src="/icons/pulse.svg" alt="Pulsing" />
        </div>
        <h2>Pulsing</h2>
      </div>
      <div class="info-popup-item" data-tool="acute">
        <div class="info-popup-icon">
          <img src="/icons/acute.svg" alt="Acute" />
        </div>
        <h2>Acute</h2>
      </div>
    </div>

    <div id="container"></div>
    <div id="haptic-debug" class="hidden"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
