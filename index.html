<!doctype html>
<html lang="en">
  <head>
    <title>three.js webgl - decal splatter</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link type="text/css" rel="stylesheet" href="src/main.css" />
  </head>
  <body>
    <div class="container-info">
      <div class="line">
        <h1 id="title">Pain(t)</h1>
      </div>
      <div class="line">
        <div>
          <button id="cancel-all-btn">
            <img src="/cancel_all.png" alt="Cancel all">
          </button>
          <button id="cancel-btn" >
            <img src="/cancel.png" alt="Cancel">
          </button>
        </div>
        <div>
          <fieldset class="mode-picker">
            <label class="radio-button">
              <input type="radio" id="point" name="mode" value="point" checked />
              <img src="/radiant.png" alt="Point">
            </label>
            <label class="radio-button">
              <input type="radio" id="pulse" name="mode" value="pulse" />
              <img src="/pulse.png" alt="Pulse">
            </label>
            <label class="radio-button">
              <input type="radio" id="acute" name="mode" value="acute" />
              <img src="/acute.png" alt="Acute">
            </label>
          </fieldset>
        </div>
        <div>
          <button id="info">
            <img src="/question_mark.png" alt="Cancel all">
          </button>
        </div>

      </div>
      <input
        class="line"
        type="range"
        id="color-bar"
        name="color"
        min="0"
        max="1000"
      />
       <input
        class="line"
        type="range"
        id="size-bar"
        name="color"
        min="0"
        max="1000"
      />
    </div>

    </div>
    <div id="container"></div>
    <div class="container-info">
      <h2>Evolution over time</h2>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
